name: "PR Labeler"

on:
  pull_request:
    types:
      - opened

permissions:
  contents: read
  pull-requests: write

jobs:
  job_pr_labeler:
    name: "PR Labeler"

    runs-on: ubuntu-latest

    steps:
      - name: "Label PR"
        uses: TimonVS/pr-labeler-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
