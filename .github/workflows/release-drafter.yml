name: "Release Drafter"

on:
  push:
    branches:
      - "main"

permissions:
  contents: write
  pull-requests: read

jobs:
  job_release_drafter:
    name: "Release Drafter"

    runs-on: ubuntu-latest

    steps:
      - name: "Update Release Notes"
        uses: release-drafter/release-drafter@v7
        with:
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
